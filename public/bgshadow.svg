<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="spotlightGradient" cx="50%" cy="0%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="30%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="70%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    
    <filter id="spotlightBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
    </filter>
  </defs>
  
  <!-- Main Spotlight Cone Beam -->
  <path
    d="M 400 0 L 250 400 L 550 400 Z"
    fill="url(#spotlightGradient)"
    filter="url(#spotlightBlur)"
    opacity="0.9"
  />
  
  <!-- Additional Soft Edge Glow -->
  <ellipse
    cx="400"
    cy="150"
    rx="180"
    ry="120"
    fill="white"
    opacity="0.15"
    filter="url(#spotlightBlur)"
  />
  
  <!-- Center Bright Spot -->
  <ellipse
    cx="400"
    cy="80"
    rx="100"
    ry="60"
    fill="white"
    opacity="0.4"
    filter="url(#spotlightBlur)"
  />
</svg>